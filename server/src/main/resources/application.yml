spring:
  application.name: swarsetu
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/swarsetu?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:swarsetu}
    password: ${DB_PASSWORD:devpass}
    hikari.maximum-pool-size: ${DB_POOL:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet.multipart:
    max-file-size: 2MB
    max-request-size: 3MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      connectiontimeout: 10000
      timeout: 10000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error.include-message: never
  compression.enabled: true

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

swarsetu:
  jwt-secret: ${JWT_SECRET:}
  access-minutes: ${ACCESS_MINUTES:15}
  refresh-days: ${REFRESH_DAYS:14}
  code-minutes: 10
  max-failures: 5
  lock-minutes: 15
  app-url: ${APP_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:Swarsetu <no-reply@localhost>}
  sms-provider: ${SMS_PROVIDER:console}
  cors-origins: ${CORS_ORIGINS:http://localhost:8080}
  reminder-zone: ${REMINDER_ZONE:Asia/Kolkata}
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    template-id: ${MSG91_TEMPLATE_ID:}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_FROM:}
